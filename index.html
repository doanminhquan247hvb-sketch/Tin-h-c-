    <script>
      // Fix for extensions or interceptors attempting to override window.fetch when defined with only a getter
      (function() {
        try {
          var _originalFetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _originalFetch;
            },
            set: function(val) {
              _originalFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          // Fallback if property definition fails
        }
      })();
